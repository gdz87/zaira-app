    --space-1:.5rem; --space-2:1rem; --space-3:1.5rem; --space-4:2rem; --space-5:3rem;
    --radius:14px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(31,41,51,.06),0 4px 14px rgba(31,41,51,.05);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.6; font-size:16px}
  h1,h2,h3{line-height:1.25; color:var(--primary-dark); margin:0 0 var(--space-2)}
  h1{font-size:1.35rem} h2{font-size:1.15rem} h3{font-size:1rem}
  p{margin:0 0 var(--space-2)} a{color:var(--focus)}
  :focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:4px}

  header.app{background:var(--primary-dark); color:#fff; position:sticky; top:0; z-index:40}
  .app-inner{max-width:1100px; margin-inline:auto; padding:var(--space-2) var(--space-3);
    display:flex; align-items:center; gap:var(--space-2); flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:.6rem; font-weight:700}
  .brand span{color:#fff}
  .brand small{display:block; font-weight:500; font-size:.72rem; color:#CBCBD1; letter-spacing:.3px}
  .user-chip{margin-left:auto; display:flex; align-items:center; gap:.6rem; font-size:.85rem; color:#D6E0EC}
  .user-chip .role{background:rgba(255,255,255,.14); padding:.15rem .6rem; border-radius:999px; font-size:.72rem; font-weight:700}
  .user-chip button{min-height:40px; border:1px solid rgba(255,255,255,.25); background:transparent; color:#fff;
    border-radius:999px; padding:0 var(--space-2); cursor:pointer; font-weight:600; font-size:.82rem}
  .user-chip button:hover{background:rgba(255,255,255,.12)}

  main{max-width:1100px; margin-inline:auto; padding:var(--space-3)}
  .confidential{display:flex; gap:.6rem; align-items:flex-start; background:var(--primary-soft);
    border:1px solid var(--border); color:#3A3A40; border-radius:var(--radius-sm); padding:.7rem var(--space-2);
    font-size:.82rem; margin-bottom:var(--space-3)}
  .confidential svg{flex:0 0 auto; margin-top:2px}

  nav.tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:var(--space-3); scrollbar-width:thin}
  nav.tabs button{min-height:44px; white-space:nowrap; border:1px solid var(--border); background:var(--surface);
    color:var(--muted); padding:0 var(--space-2); border-radius:999px; cursor:pointer; font-size:.88rem; font-weight:600;
    display:inline-flex; align-items:center; gap:.4rem}
  nav.tabs button[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
  nav.tabs .badge{background:var(--danger); color:#fff; border-radius:999px; font-size:.68rem; min-width:18px; height:18px;
    padding:0 5px; display:inline-flex; align-items:center; justify-content:center}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:var(--space-4);
    box-shadow:var(--shadow); margin-bottom:var(--space-3)}
  .card.tight{padding:var(--space-3)}
  .card-head{display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); flex-wrap:wrap; margin-bottom:var(--space-2)}
  .card-head h2,.card-head h3{margin:0}
  .muted{color:var(--muted)} .small{font-size:.82rem}
  .grid{display:grid; gap:var(--space-3)}
  @media(min-width:760px){ .grid.cols-2{grid-template-columns:1fr 1fr} .grid.cols-3{grid-template-columns:repeat(3,1fr)} }

  label{display:block; font-weight:600; font-size:.85rem; margin-bottom:.3rem}
  input,select,textarea{width:100%; min-height:44px; font:inherit; color:var(--text); background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius-sm); padding:.55rem .7rem}
  textarea{min-height:90px; resize:vertical; line-height:1.55}
  .field{margin-bottom:var(--space-2)}
  .hint{font-size:.78rem; color:var(--muted); margin-top:.25rem; font-weight:400}

  .btn{min-height:44px; border:0; border-radius:var(--radius-sm); padding:0 var(--space-3); font:inherit; font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:.45rem; background:var(--primary); color:#fff}
  .btn:hover{background:var(--primary-dark)} .btn:disabled{opacity:.6; cursor:default}
  .btn.accent{background:var(--accent)} .btn.accent:hover{background:var(--accent-dark)}
  .btn.ghost{background:transparent; color:var(--primary); border:1px solid var(--border)}
  .btn.ghost:hover{background:var(--primary-soft)}
  .btn.danger{background:var(--danger)} .btn.sm{min-height:36px; padding:0 var(--space-2); font-size:.84rem}
  .btn-row{display:flex; gap:.6rem; flex-wrap:wrap}
  .btn.block{width:100%}

  .pill{display:inline-flex; align-items:center; gap:.35rem; font-size:.74rem; font-weight:700; padding:.2rem .6rem; border-radius:999px}
  .pill.ok{background:var(--ok-soft); color:var(--ok)} .pill.warn{background:var(--warn-soft); color:var(--warn)}
  .pill.danger{background:var(--danger-soft); color:var(--danger)} .pill.info{background:var(--primary-soft); color:var(--primary)}
  .pill.neutral{background:#EEF1F4; color:var(--muted)}

  .list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.6rem}
  .item{border:1px solid var(--border); border-radius:var(--radius-sm); padding:var(--space-2); background:var(--surface-2);
    display:flex; gap:var(--space-2); align-items:flex-start; justify-content:space-between}
  .item.clickable{cursor:pointer} .item.clickable:hover{border-color:var(--primary); background:var(--primary-soft)}
  .item .meta{font-size:.78rem; color:var(--muted)} .item-main{min-width:0} .item-main strong{display:block}
  .empty{text-align:center; color:var(--muted); padding:var(--space-4) var(--space-2); font-size:.9rem}
  .empty svg{opacity:.5; margin-bottom:.5rem}

  table{width:100%; border-collapse:collapse; font-size:.88rem}
  th,td{text-align:left; padding:.5rem .4rem; border-bottom:1px solid var(--border)}
  th{color:var(--muted); font-size:.76rem; text-transform:uppercase; letter-spacing:.4px}
  .table-wrap{overflow-x:auto}

  .overlay{position:fixed; inset:0; background:rgba(31,41,51,.45); display:none; z-index:60; align-items:flex-end; justify-content:center}
  .overlay.open{display:flex}
  .modal{background:var(--surface); width:100%; max-width:640px; max-height:92vh; overflow:auto; border-radius:18px 18px 0 0; padding:var(--space-4)}
  @media(min-width:760px){ .overlay{align-items:center} .modal{border-radius:18px} }
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--space-3)}
  .icon-btn{min-width:44px; min-height:44px; border:0; background:transparent; cursor:pointer; border-radius:999px; color:var(--muted);
    display:inline-flex; align-items:center; justify-content:center}
  .icon-btn:hover{background:#EEF1F4}

  .risk{background:var(--danger-soft); border:1px solid #E6C3C9; border-left:5px solid var(--danger); border-radius:var(--radius-sm);
    padding:var(--space-2) var(--space-3); margin-bottom:var(--space-2)}
  .risk h3{color:var(--danger); display:flex; align-items:center; gap:.5rem}
  .disclaimer{font-size:.76rem; color:var(--muted); font-style:italic; margin-top:.3rem}

  .scale-row{display:flex; gap:4px; flex-wrap:wrap}
  .scale-row input[type=radio]{position:absolute; opacity:0; width:0; height:0}
  .scale-row label{flex:1; min-width:42px; text-align:center; border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:.5rem .2rem; cursor:pointer; margin:0; font-weight:600; min-height:44px; display:flex; align-items:center;
    justify-content:center; font-size:.9rem; color:var(--muted)}
  .scale-row input[type=radio]:checked + label{background:var(--primary); color:#fff; border-color:var(--primary)}
  .scale-row input[type=radio]:focus-visible + label{outline:3px solid var(--focus); outline-offset:2px}

  .geno-wrap{border:1px dashed var(--border); border-radius:var(--radius-sm);
    background:radial-gradient(circle, #E3E9EF 1px, transparent 1px); background-size:22px 22px; overflow:hidden; touch-action:none}
  .geno-toolbar{display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:var(--space-2)}

  .kpi{display:flex; flex-direction:column; gap:.1rem; padding:var(--space-2); border:1px solid var(--border);
    border-radius:var(--radius-sm); background:var(--surface-2)}
  .kpi .n{font-size:1.5rem; font-weight:800; color:var(--primary-dark); line-height:1.1}
  .kpi .l{font-size:.76rem; color:var(--muted)}

  .auth-wrap{max-width:420px; margin:var(--space-5) auto; padding:0 var(--space-2)}
  .auth-tabs{display:flex; gap:6px; margin-bottom:var(--space-3)}
  .auth-tabs button{flex:1; min-height:44px; border:1px solid var(--border); background:var(--surface); color:var(--muted);
    border-radius:var(--radius-sm); font-weight:700; cursor:pointer}
  .auth-tabs button[aria-pressed="true"]{background:var(--primary); color:#fff; border-color:var(--primary)}
  .err{background:var(--danger-soft); color:var(--danger); border-radius:var(--radius-sm); padding:.6rem var(--space-2);
    font-size:.85rem; margin-bottom:var(--space-2); display:none}
  .err.show{display:block}
  details.note{border:1px solid var(--border); border-radius:var(--radius-sm); padding:.7rem var(--space-2); background:var(--surface-2); margin-bottom:var(--space-2)}
  details.note summary{cursor:pointer; font-weight:600; font-size:.85rem}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0)}
  footer{max-width:1100px; margin:var(--space-4) auto 0; padding:var(--space-3); color:var(--muted); font-size:.76rem; text-align:center}
  .codebox{font-family:ui-monospace,Menlo,Consolas,monospace; background:#EEF1F4; border-radius:var(--radius-sm);
    padding:.5rem .7rem; font-size:.85rem; word-break:break-all}
  .brand-logo{width:46px;height:46px;flex:0 0 auto;background:var(--logo) center/contain no-repeat}
  .auth-logo{width:160px;height:160px;max-width:60%;margin:0 auto;background:var(--logo) center/contain no-repeat}
</style>
</head>
<body>

<header class="app">
  <div class="app-inner">
    <div class="brand">
      <span class="brand-logo" role="img" aria-label="Zaira K Mora, Psicóloga"></span>
      <span>Zaira K Mora<small>Psicóloga · Asistente clínico</small></span>
    </div>
    <div class="user-chip" id="userChip"></div>
  </div>
</header>

<main id="app"></main>
<footer id="foot"></footer>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">Título</h2>
      <button class="icon-btn" aria-label="Cerrar" onclick="closeModal()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button></div>
    <div id="modalBody"></div>
  </div>
</div>

  if(/Invalid login/i.test(m)) return 'Credenciales incorrectas.';
  if(/already registered|already been registered/i.test(m)) return 'Ese correo ya está registrado.';
  if(/row-level security|permission denied/i.test(m)) return 'No autorizado.';
  if(/JWT|session/i.test(m)) return 'Sesión expirada.';
  if(/rate limit/i.test(m)) return 'Demasiados intentos; espera unos minutos.';
  if(/Failed to fetch|NetworkError/i.test(m)) return 'Error de red.';
  return m||'Error.';
}
const chk=({data,error})=>{ if(error) throw new Error(trad(error.message)); return data; };
const clip=(s,n=5000)=>String(s??'').slice(0,n);
const num=v=>{ const n=Number(v); return Number.isFinite(n)?n:0; };
const hoy=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/Bogota'});
const row2=r=>({...r.data,id:r.id,patientId:r.patient_id});
const pac2=p=>({id:p.id,profId:p.prof_id,nombre:p.nombre,codigo:p.codigo,motivo:p.motivo,enfoque:p.enfoque,fechaAlta:p.fecha_alta});

async function whoami(){
  const { data:{ session } } = await sb.auth.getSession(); if(!session) return null;
  const u=session.user;
  if(u.app_metadata?.role==='pac'){
    const p=chk(await sb.from('pacientes').select('*').eq('user_id',u.id).maybeSingle());
    if(!p) throw new Error('Cuenta de paciente sin vincular.');
    return { role:'pac', id:u.id, nombre:p.nombre, patientId:p.id, profId:p.prof_id };
  }
  const pr=chk(await sb.from('profesionales').select('*').eq('id',u.id).maybeSingle());
  if(!pr) throw new Error('Cuenta sin perfil profesional.');
  return { role:'prof', id:u.id, nombre:pr.nombre, email:pr.email };
}
async function allRegs(){ return chk(await sb.from('registros').select('*').order('created_at',{ascending:true}).range(0,9999)); }
async function stateProf(){
  const pacs=chk(await sb.from('pacientes').select('*').order('fecha_alta',{ascending:true}).range(0,9999));
  const regs=await allRegs(); const by=k=>regs.filter(r=>r.kind===k).map(row2);
  const accounts={}; pacs.forEach(p=>{ if(p.username) accounts[p.id]=p.username; });
  return { role:'prof', nombre:ME.nombre, email:ME.email, patients:pacs.map(pac2),
    sessions:by('sessions'), goals:by('goals'), genograms:by('genograms'), diary:by('diary'), homework:by('homework'),
    tests:by('tests'), cases:by('cases'), resources:regs.filter(r=>r.kind==='resources').map(r=>({...r.data,id:r.id,profId:r.prof_id})), accounts };
}
async function statePac(){
  const p=chk(await sb.from('pacientes').select('*').eq('user_id',ME.id).maybeSingle());
  const regs=await allRegs(); const by=k=>regs.filter(r=>r.kind===k).map(row2);
  return { role:'pac', nombre:ME.nombre, patientId:ME.patientId, patient:p?pac2(p):null,
    diary:by('diary'), homework:by('homework'), tests:by('tests'), resources:regs.filter(r=>r.kind==='resources').map(r=>({...r.data,id:r.id,profId:r.prof_id})) };
}
async function insReg(kind,patientId,data){ chk(await sb.from('registros').insert({prof_id:ME.id,patient_id:patientId||null,kind,data})); }
async function fn(body){
  const { data, error } = await sb.functions.invoke('crear-acceso',{ body });
  if(error){ let m='Error de red.'; try{ m=(await error.context.json()).error||m; }catch{} throw new Error(m); }
  return data;
}
async function api(path, { method='GET', body } = {}){
  const s=path.split('/'); body=body||{};
  try{
  if(s[0]==='login'){
    const u=clip(body.username,160).trim().toLowerCase(); const email=u.includes('@')?u:u+PAC_DOMAIN;
    chk(await sb.auth.signInWithPassword({ email, password:String(body.password||'') }));
    ME=await whoami(); return { token:'sb', role:ME.role, nombre:ME.nombre };
  }
  if(s[0]==='register'){
    const nombre=clip(body.nombre,120).trim(), email=clip(body.email,160).trim().toLowerCase(), pw=String(body.password||'');
    if(!nombre||!email||pw.length<6) throw new Error('Nombre, correo y contraseña (mín. 6) son obligatorios.');
    if(email.endsWith(PAC_DOMAIN)) throw new Error('Ese correo no está permitido.');
    const d=chk(await sb.auth.signUp({ email, password:pw, options:{ data:{ nombre } } }));
    if(d.user && Array.isArray(d.user.identities) && !d.user.identities.length) throw new Error('Ese correo ya está registrado.');
    if(!d.session) throw new Error('Revisa tu correo para confirmar la cuenta y luego inicia sesión.');
    ME=await whoami(); return { token:'sb', role:'prof', nombre };
  }
  if(!ME) ME=await whoami();
  if(!ME) throw new Error('Sesión no válida.');
  if(s[0]==='state') return ME.role==='prof' ? stateProf() : statePac();
  if(ME.role==='prof'){
    if(s[0]==='patients' && !s[1] && method==='POST'){
      const nombre=clip(body.nombre,120).trim(); if(!nombre) throw new Error('El nombre es obligatorio.');
      const r=chk(await sb.from('pacientes').insert({ prof_id:ME.id, nombre, codigo:clip(body.codigo,40).trim()||('P-'+crypto.getRandomValues(new Uint16Array(1))[0].toString(16).toUpperCase().padStart(4,'0')),
        motivo:clip(body.motivo,500), enfoque:clip(body.enfoque,60), fecha_alta:hoy() }).select('id').single());
      return { ok:true, id:r.id };
    }
    if(s[0]==='patients' && s[2]==='access') return fn({ action:'access', patientId:s[1], username:body.username, password:body.password });
    if(s[0]==='patients' && s[1] && method==='PUT'){
      const upd={ motivo:clip(body.motivo,500), enfoque:clip(body.enfoque,60) }; const n=clip(body.nombre,120).trim(), c=clip(body.codigo,40).trim();
      if(n) upd.nombre=n; if(c) upd.codigo=c; chk(await sb.from('pacientes').update(upd).eq('id',s[1])); return { ok:true };
    }
    if(s[0]==='sessions' && method==='POST'){ await insReg('sessions',body.patientId,{ fecha:clip(body.fecha,10)||hoy(), tipo:body.tipo==='DAP'?'DAP':'SOAP', s:clip(body.s), o:clip(body.o), a:clip(body.a), p:clip(body.p) }); return { ok:true }; }
    if((s[0]==='sessions'||s[0]==='cases') && s[1] && method==='DELETE'){ chk(await sb.from('registros').delete().eq('id',s[1]).eq('kind',s[0])); return { ok:true }; }
    if(s[0]==='goals' && !s[1]){ await insReg('goals',body.patientId,{ titulo:clip(body.titulo,160), metrica:clip(body.metrica,120), baseline:num(body.baseline), target:num(body.target), progresos:[{ fecha:hoy(), valor:num(body.baseline) }] }); return { ok:true }; }
    if(s[0]==='goals' && s[2]==='progress'){
      const g=chk(await sb.from('registros').select('*').eq('id',s[1]).eq('kind','goals').single()); const d=g.data||{};
      d.progresos=[...(d.progresos||[]),{ fecha:hoy(), valor:num(body.valor) }]; chk(await sb.from('registros').update({ data:d }).eq('id',g.id)); return { ok:true };
    }
    if(s[0]==='genograms'){
      const nodes=Array.isArray(body.nodes)?body.nodes.slice(0,100):[], edges=Array.isArray(body.edges)?body.edges.slice(0,200):[];
      const ex=chk(await sb.from('registros').select('id').eq('kind','genograms').eq('patient_id',body.patientId).limit(1));
      if(ex.length) chk(await sb.from('registros').update({ data:{ nodes, edges } }).eq('id',ex[0].id)); else await insReg('genograms',body.patientId,{ nodes, edges });
      return { ok:true };
    }
    if(s[0]==='homework' && !s[1]){ await insReg('homework',body.patientId,{ titulo:clip(body.titulo,160), descripcion:clip(body.descripcion,1000), estado:'Pendiente', fechaAsignada:hoy() }); return { ok:true }; }
    if(s[0]==='cases' && method==='POST'){
      const campos={}; if(body.campos && typeof body.campos==='object') Object.keys(body.campos).slice(0,30).forEach(k=>campos[clip(k,80)]=clip(body.campos[k],2000));
      await insReg('cases',body.patientId,{ enfoque:clip(body.enfoque,60), fecha:hoy(), campos }); return { ok:true };
    }
    if(s[0]==='resources'){ await insReg('resources',null,{ titulo:clip(body.titulo,160), cat:clip(body.cat,60)||'General', tipo:clip(body.tipo,60)||'Recurso', contenido:clip(body.contenido,2000) }); return { ok:true }; }
    if(s[0]==='tests'){ chk(await sb.rpc('registrar_prueba',{ p_tipo:body.tipo, p_resp:(body.respuestas||[]).map(v=>Math.round(num(v))), p_patient:body.patientId })); return { ok:true }; }
    if(s[0]==='data' && method==='DELETE') return fn({ action:'wipe' });
  } else {
    if(s[0]==='diary'){ chk(await sb.rpc('pac_diario',{ p:body })); return { ok:true }; }
    if(s[0]==='homework' && s[2]==='done'){ chk(await sb.rpc('pac_tarea_hecha',{ rid:s[1] })); return { ok:true }; }
    if(s[0]==='tests'){ chk(await sb.rpc('registrar_prueba',{ p_tipo:body.tipo, p_resp:(body.respuestas||[]).map(v=>Math.round(num(v))) })); return { ok:true }; }
  }
  throw new Error('Ruta no encontrada.');
  }catch(e){ if(/Sesión (expirada|no válida)/.test(e.message) && TOKEN){ logout(); } throw e; }
}
function logout(){ TOKEN=null; ST=null; ME=null; CURRENT=null; AUTHMODE='login'; sb.auth.signOut().catch(()=>{}); render(); }
async function refresh(){ TOKEN='sb'; ST = await api('state'); render(); }

const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>{ if(!d) return '—'; const x=new Date(d+'T00:00:00'); return x.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}); };
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=id=>document.getElementById(id).value.trim();
function go(t){ TAB=t; render(); window.scrollTo(0,0); }

============================================================ */
function render(){
  const chip=document.getElementById('userChip');
  const foot=document.getElementById('foot');
  if (!TOKEN || !ST){ chip.innerHTML=''; foot.innerHTML='v1.1 · sincronización profesional↔paciente mediante cuentas seguras.'; return authView(); }
  chip.innerHTML = `<span class="role">${ST.role==='prof'?'Profesional':'Paciente'}</span>
    <span>${esc(ST.nombre)}</span>
    <button onclick="logout()">Salir</button>`;
  foot.innerHTML = ST.role==='prof'
    ? 'Información reservada · protegida por secreto profesional · respaldada en la nube.'
    : 'Tu espacio seguro · compartido solo con tu psicóloga.';
  document.getElementById('app').innerHTML = ST.role==='prof' ? profShell() : pacShell();
}

async function doLogin(){
  const b=document.getElementById('loginBtn'); b.disabled=true;
  try{ const r=await api('login',{method:'POST',body:{username:val('l_u'),password:document.getElementById('l_p').value}});
    TOKEN=r.token; localStorage.setItem('aclin_token',TOKEN); await refresh();
  }catch(e){ authErr(e.message); b.disabled=false; }
}
async function doRegister(){
  const b=document.getElementById('regBtn'); b.disabled=true;
  try{ const r=await api('register',{method:'POST',body:{nombre:val('r_n'),email:val('r_e'),password:document.getElementById('r_p').value}});
    TOKEN=r.token; localStorage.setItem('aclin_token',TOKEN); await refresh();
  }catch(e){ authErr(e.message); b.disabled=false; }
}

/* ============================================================
   ALERTAS DE RIESGO (cliente, a partir del estado)
============================================================ */
function riskSignals(pid){
  const out=[];
  (ST.diary||[]).filter(d=>d.patientId===pid).forEach(d=>{ if(+d.intensidad>=8) out.push({fecha:d.fecha,tipo:'Malestar intenso',det:`Emoción "${d.emocion}" · intensidad ${d.intensidad}/10`}); });
  (ST.tests||[]).filter(t=>t.patientId===pid&&t.tipo==='PHQ9').forEach(t=>{ if(t.respuestas&&+t.respuestas[8]>0) out.push({fecha:t.fecha,tipo:'Ítem 9 PHQ-9',det:'Pensamientos de hacerse daño / estar mejor muerto(a)'}); });
  return out.sort((a,b)=>b.fecha.localeCompare(a.fecha));
}
function totalRisk(){ return (ST.patients||[]).reduce((n,p)=>n+(riskSignals(p.id).length?1:0),0); }

/* ============================================================
   VISTA PROFESIONAL
============================================================ */
function profShell(){
  const rc=totalRisk();
  const tabs=[['inicio','Inicio'],['expediente','Expediente'],['intersesion','Inter-sesión',rc],['psicometria','Psicometría'],['recursos','Recursos'],['supervision','Supervisión']];
  const nav=tabs.map(t=>`<button role="tab" aria-selected="${TAB===t[0]}" onclick="go('${t[0]}')">${t[1]}${t[2]?`<span class="badge">${t[2]}</span>`:''}</button>`).join('');
  let body='';
  if(TAB==='inicio') body=profInicio();
  else if(TAB==='expediente') body=profExpediente();
  else if(TAB==='intersesion') body=profInter();
  else if(TAB==='psicometria') body=profPsico();
  else if(TAB==='recursos') body=recursosView(true);
  else if(TAB==='supervision') body=profSupervision();
  else { TAB='inicio'; body=profInicio(); }
  return `
    <div class="confidential">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z" stroke="#3A3A40" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="#3A3A40" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><strong>Información reservada.</strong> Protegida por secreto profesional.</div>
    </div>
    <nav class="tabs" role="tablist">${nav}</nav>${body}`;
}
function profInicio(){
  const p=ST.patients.length,s=ST.sessions.length,t=ST.tests.length,rc=totalRisk();
  const recientes=[...ST.sessions].sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,5);
  return `
  <div class="grid cols-3" style="margin-bottom:var(--space-3)">
    <div class="kpi"><span class="n">${p}</span><span class="l">Pacientes</span></div>
    <div class="kpi"><span class="n">${s}</span><span class="l">Notas de sesión</span></div>
    <div class="kpi"><span class="n">${t}</span><span class="l">Pruebas</span></div></div>
  ${rc?`<div class="risk"><h3>${riskIcon()} ${rc} paciente(s) con señales de atención</h3>
    <p class="small" style="margin:0">Revisa <strong>Inter-sesión</strong>.</p>
    <p class="disclaimer">Señales de apoyo a la priorización. No son diagnóstico ni valoración de riesgo.</p></div>`:''}
  <div class="card"><div class="card-head"><h2>Actividad reciente</h2><button class="btn sm" onclick="go('expediente')">Expediente</button></div>
    ${recientes.length?`<ul class="list">${recientes.map(se=>{const pt=ST.patients.find(x=>x.id===se.patientId);
      return `<li class="item"><div class="item-main"><strong>${esc(pt?pt.nombre:'—')}</strong><span class="meta">${se.tipo} · ${fmt(se.fecha)}</span></div><span class="pill info">${se.tipo}</span></li>`;}).join('')}</ul>`
      :emptyBox('Aún no hay sesiones.')}
  </div>`;
}

/* ---- MÓDULO 1: EXPEDIENTE ---- */
function profExpediente(){
  if(CURRENT) return expedienteDetalle(CURRENT);
  const list=ST.patients.length?`<ul class="list">${ST.patients.map(p=>{const r=riskSignals(p.id).length;
    return `<li class="item clickable" onclick="CURRENT='${p.id}';render()"><div class="item-main">
      <strong>${esc(p.nombre)} ${r?`<span class="pill danger">${riskIcon(12)} atención</span>`:''}</strong>
      <span class="meta">Cód. ${esc(p.codigo)} · ${esc(p.motivo||'Sin motivo')}</span></div>
      <span class="pill neutral">${esc(p.enfoque||'—')}</span></li>`;}).join('')}</ul>`
    :emptyBox('No hay pacientes. Crea el primero.');
  return `<div class="card"><div class="card-head"><h2>Pacientes</h2><button class="btn" onclick="formPaciente()">+ Nuevo paciente</button></div>${list}</div>`;
}
function expedienteDetalle(id){
  const p=ST.patients.find(x=>x.id===id); if(!p){CURRENT=null;return profExpediente();}
  const ses=ST.sessions.filter(s=>s.patientId===id).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const goals=ST.goals.filter(g=>g.patientId===id);
  const geno=ST.genograms.find(g=>g.patientId===id);
  const acc=ST.accounts[id];
  return `
  <div class="btn-row" style="margin-bottom:var(--space-2)"><button class="btn ghost sm" onclick="CURRENT=null;render()">← Pacientes</button></div>
  <div class="card"><div class="card-head"><h2>${esc(p.nombre)}</h2><span class="pill neutral">${esc(p.enfoque||'—')}</span></div>
    <p class="small muted" style="margin:0">Cód. ${esc(p.codigo)} · Alta ${fmt(p.fechaAlta)} · ${esc(p.motivo||'')}</p>
    <div class="btn-row" style="margin-top:var(--space-2)">
      <button class="btn ghost sm" onclick="formPaciente('${id}')">Editar datos</button>
      <button class="btn accent sm" onclick="formAccess('${id}')">${acc?'Acceso del paciente ✓':'Crear acceso del paciente'}</button>
    </div>
    ${acc?`<p class="small muted" style="margin:.5rem 0 0">Usuario del paciente: <strong>${esc(acc)}</strong></p>`:''}
  </div>

  <div class="card"><div class="card-head"><h2>Notas de sesión (SOAP / DAP)</h2><button class="btn" onclick="formSesion('${id}')">+ Nota</button></div>
    <details class="note"><summary>¿Qué es SOAP / DAP?</summary>
      <p class="small muted" style="margin:.5rem 0 0"><strong>SOAP</strong>: Subjetivo · Objetivo · Análisis · Plan. <strong>DAP</strong>: Datos · Análisis · Plan.</p></details>
    ${ses.length?`<ul class="list">${ses.map(s=>`<li class="item clickable" onclick="verSesion('${s.id}')">
      <div class="item-main"><strong>${fmt(s.fecha)} · ${s.tipo}</strong><span class="meta">${esc((s.s||s.p||'').slice(0,70))}…</span></div>
      ${chevron()}</li>`).join('')}</ul>`:emptyBox('Sin notas.')}
  </div>

  <div class="card"><div class="card-head"><h2>Objetivos terapéuticos</h2><button class="btn" onclick="formGoal('${id}')">+ Objetivo</button></div>
    ${goals.length?goals.map(goalCard).join(''):emptyBox('Sin objetivos.')}
  </div>

  <div class="card"><div class="card-head"><h2>Genograma / mapa conceptual</h2>
    <button class="btn" onclick="abrirGenograma('${id}')">${geno&&geno.nodes.length?'Abrir / editar':'Crear mapa'}</button></div>
    <p class="small muted">Diagrama interactivo de familia, esquemas o creencias.</p>
    ${geno&&geno.nodes.length?`<p class="pill info">${geno.nodes.length} nodo(s) · ${geno.edges.length} vínculo(s)</p>`:''}
  </div>`;
}
function goalCard(g){
  const prog=g.progresos||[]; const last=prog.length?prog[prog.length-1].valor:g.baseline;
  const pct=(g.target!=null&&g.baseline!=null&&g.target!==g.baseline)?Math.max(0,Math.min(100,Math.round((g.baseline-last)/(g.baseline-g.target)*100))):null;
  return `<div class="card tight" style="margin-bottom:var(--space-2)"><div class="card-head"><h3>${esc(g.titulo)}</h3>
    <button class="btn ghost sm" onclick="registrarProgreso('${g.id}')">+ Medición</button></div>
    <p class="small muted" style="margin:0">Métrica: ${esc(g.metrica)} · Base ${g.baseline} → Meta ${g.target} · Actual <strong>${last}</strong></p>
    ${pct!=null?`<div style="background:#EEF1F4;border-radius:999px;height:10px;margin-top:.6rem;overflow:hidden"><div style="width:${pct}%;height:100%;background:var(--accent)"></div></div><span class="small muted">${pct}% hacia la meta</span>`:''}
    ${prog.length>1?sparkline(prog.map(x=>x.valor)):''}</div>`;
}

/* ---- MÓDULO 2: INTER-SESIÓN ---- */
function profInter(){
  const alerts=[];
  ST.patients.forEach(p=>riskSignals(p.id).forEach(r=>alerts.push({...r,nombre:p.nombre})));
  alerts.sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const diary=[...ST.diary].sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,12);
  return `
  ${alerts.length?`<div class="risk"><h3>${riskIcon()} Señales de atención</h3>
    <ul class="list" style="margin-top:.6rem">${alerts.slice(0,8).map(a=>`<li class="item" style="background:#fff">

function profPsico(){
  const tests=[...ST.tests].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  return `
  <div class="card"><div class="card-head"><h2>Batería psicométrica</h2></div>
    <p class="small muted">Instrumentos de tamizaje autocalificables.</p>
    <div class="grid cols-2">
      <div class="card tight"><h3>PHQ-9</h3><p class="small muted">Depresión · 9 ítems · 0–27</p><button class="btn accent" onclick="aplicarTest('PHQ9')">Aplicar</button></div>
      <div class="card tight"><h3>GAD-7</h3><p class="small muted">Ansiedad · 7 ítems · 0–21</p><button class="btn accent" onclick="aplicarTest('GAD7')">Aplicar</button></div>
    </div></div>
  <div class="card"><div class="card-head"><h2>Resultados y evolución</h2></div>
    ${tests.length?testEvolucion(tests)+`<div class="table-wrap"><table><thead><tr><th>Paciente</th><th>Prueba</th><th>Fecha</th><th>Puntaje</th><th>Interpretación</th></tr></thead>
      <tbody>${tests.map(t=>{const pt=ST.patients.find(x=>x.id===t.patientId);
        return `<tr><td>${esc(pt?pt.nombre:'—')}</td><td>${t.tipo==='PHQ9'?'PHQ-9':'GAD-7'}</td><td>${fmt(t.fecha)}</td><td><strong>${t.total}</strong></td>
        <td><span class="pill ${t.sev}">${esc(t.interpretacion)}</span></td></tr>`;}).join('')}</tbody></table></div>`
      :emptyBox('Sin pruebas aplicadas.')}
  </div>`;
}
function testEvolucion(tests){
  const g={}; tests.forEach(t=>{const k=t.patientId+'_'+t.tipo;(g[k]=g[k]||[]).push(t);});
  let html='';
  Object.values(g).forEach(arr=>{ if(arr.length<2)return; const s=[...arr].sort((a,b)=>a.fecha.localeCompare(b.fecha));
    const pt=ST.patients.find(x=>x.id===s[0].patientId); const max=s[0].tipo==='PHQ9'?27:21;
    html+=`<div class="card tight" style="margin-bottom:var(--space-2)"><h3>${esc(pt?pt.nombre:'—')} · ${s[0].tipo==='PHQ9'?'PHQ-9':'GAD-7'}</h3>
      ${sparkline(s.map(x=>x.total),max)}<span class="small muted">${s.map(x=>x.total).join(' → ')}</span></div>`; });
  return html;
}

/* ---- Psicometría ---- */
const PHQ9=['Poco interés o placer en hacer las cosas','Se ha sentido decaído(a), deprimido(a) o sin esperanza',
'Problemas para dormir, permanecer dormido(a) o dormir demasiado','Se ha sentido cansado(a) o con poca energía',
'Poco apetito o ha comido en exceso','Se ha sentido mal consigo mismo(a): que es un fracaso o que ha defraudado a su familia',
'Dificultad para concentrarse (leer, ver televisión)','Se ha movido/hablado tan lento que otros lo notaron; o, al contrario, muy inquieto(a)',
'Pensamientos de que estaría mejor muerto(a) o de hacerse daño de algún modo'];
const GAD7=['Sentirse nervioso(a), ansioso(a) o con los nervios de punta','No poder dejar de preocuparse o controlar la preocupación',
'Preocuparse demasiado por diferentes cosas','Dificultad para relajarse','Estar tan inquieto(a) que cuesta quedarse quieto(a)',
'Molestarse o irritarse con facilidad','Sentir miedo como si algo terrible fuera a pasar'];
const OPC=['Nunca','Varios días','Más de la mitad de los días','Casi todos los días'];
function aplicarTest(tipo){
  const items=tipo==='PHQ9'?PHQ9:GAD7;
  const selPac = ST.role==='prof'
    ? `<div class="field"><label for="t_p">Paciente</label><select id="t_p">${ST.patients.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select></div>`
    : '';
  if(ST.role==='prof' && !ST.patients.length){ return mErr('Primero crea un paciente.'); }
  openModal(tipo==='PHQ9'?'PHQ-9 · Depresión':'GAD-7 · Ansiedad',`
    ${selPac}<p class="small muted">Durante las últimas 2 semanas, ¿con qué frecuencia le han molestado estos problemas?</p>
    ${items.map((q,i)=>`<div class="field"><label>${i+1}. ${q}</label>
      <div class="scale-row" role="radiogroup" aria-label="Pregunta ${i+1}">
      ${OPC.map((o,v)=>`<input type="radio" name="q${i}" id="q${i}_${v}" value="${v}" ${v===0?'checked':''}><label for="q${i}_${v}" title="${o}">${v}</label>`).join('')}</div>
      <span class="hint">0 Nunca · 1 Varios días · 2 Más de la mitad · 3 Casi todos los días</span></div>`).join('')}
    <div class="btn-row"><button class="btn accent" onclick="calificar('${tipo}')">Calificar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`);
}
function calificar(tipo){ act(async()=>{
  const n=tipo==='PHQ9'?9:7; const resp=[];
  for(let i=0;i<n;i++) resp.push(+(document.querySelector(`input[name=q${i}]:checked`).value));
  const body={tipo,respuestas:resp};
  if(ST.role==='prof') body.patientId=document.getElementById('t_p').value;
  await api('tests',{method:'POST',body});
  await refresh();
  // Interpretación para mostrar (coincide con el servidor)
  const total=resp.reduce((a,b)=>a+b,0); let intp,sev;
  if(tipo==='PHQ9'){ if(total<=4)[intp,sev]=['Mínima','ok'];else if(total<=9)[intp,sev]=['Leve','info'];else if(total<=14)[intp,sev]=['Moderada','warn'];else if(total<=19)[intp,sev]=['Moderadamente grave','warn'];else[intp,sev]=['Grave','danger']; }
  else { if(total<=4)[intp,sev]=['Mínima','ok'];else if(total<=9)[intp,sev]=['Leve','info'];else if(total<=14)[intp,sev]=['Moderada','warn'];else[intp,sev]=['Grave','danger']; }
  const item9=tipo==='PHQ9'&&resp[8]>0;
  openModal('Resultado',`
    <div class="kpi" style="margin-bottom:var(--space-2)"><span class="n">${total}<span class="small muted" style="font-size:.9rem"> / ${tipo==='PHQ9'?27:21}</span></span><span class="l">Puntaje total</span></div>
    <p>Interpretación: <span class="pill ${sev}">${intp}</span></p>
    ${item9?`<div class="risk"><h3>${riskIcon(16)} Ítem 9 positivo</h3><p class="small" style="margin:0">Se reportaron pensamientos de hacerse daño. Amerita valoración clínica directa.</p></div>`:''}
    <p class="disclaimer">Instrumento de tamizaje. No sustituye la evaluación ni el diagnóstico profesional.</p>
    <div class="btn-row"><button class="btn" onclick="closeModal()">Listo</button></div>`);
}); }

/* ---- Conceptualización ---- */
const CONCEPT_TPL={
  'Cognitivo-Conductual':['Situación / disparador','Pensamientos automáticos','Emociones','Conductas','Creencias centrales e intermedias','Factores de mantenimiento','Objetivos de intervención'],
  'Sistémico':['Estructura familiar','Patrones de interacción','Reglas y mitos familiares','Ciclo sintomático','Recursos del sistema','Hipótesis sistémica'],
  'Humanista':['Experiencia actual del cliente','Condiciones de valía','Incongruencia (yo real / yo ideal)','Tendencia actualizante y recursos','Relación terapéutica'],
  'Psicoanalítico':['Demanda y síntoma','Conflictos nucleares','Mecanismos de defensa','Patrón relacional / relaciones objetales','Transferencia','Hipótesis dinámica'],
  'ACT':['Valores','Fusión cognitiva','Evitación experiencial','Yo como contexto','Acción comprometida','Barreras a la flexibilidad']};
function formConcept(){ if(!ST.patients.length)return mErr('Primero crea un paciente.');
  openModal('Nueva conceptualización',`
    <div class="field"><label for="c_p">Paciente</label><select id="c_p">${ST.patients.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select></div>
    <div class="field"><label for="c_e">Enfoque</label><select id="c_e" onchange="renderConceptFields()">${Object.keys(CONCEPT_TPL).map(e=>`<option>${e}</option>`).join('')}</select></div>
    <div id="conceptFields"></div>
    <div class="btn-row"><button class="btn" onclick="saveConcept()">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`);
  renderConceptFields(); }
function renderConceptFields(){ const e=document.getElementById('c_e').value;
  document.getElementById('conceptFields').innerHTML=CONCEPT_TPL[e].map((f,i)=>`<div class="field"><label for="cf${i}">${f}</label><textarea id="cf${i}"></textarea></div>`).join(''); }
function saveConcept(){ act(async()=>{ const e=document.getElementById('c_e').value; const campos={};
  CONCEPT_TPL[e].forEach((f,i)=>campos[f]=val('cf'+i));
  await api('cases',{method:'POST',body:{patientId:document.getElementById('c_p').value,enfoque:e,campos}});
  closeModal(); await refresh(); }); }
function verConcept(id){ const c=ST.cases.find(x=>x.id===id); const pt=ST.patients.find(x=>x.id===c.patientId);
  openModal(`${esc(c.enfoque)} · ${esc(pt?pt.nombre:'')}`,
    Object.entries(c.campos).map(([k,v])=>`<p><strong>${esc(k)}:</strong><br>${esc(v||'—')}</p>`).join('')
    +`<div class="btn-row"><button class="btn danger sm" onclick="delConcept('${id}')">Eliminar</button><button class="btn ghost sm" onclick="closeModal()">Cerrar</button></div>`); }
function delConcept(id){ if(!confirm('¿Eliminar?'))return; act(async()=>{ await api('cases/'+id,{method:'DELETE'}); closeModal(); await refresh(); }); }

/* ---- Recursos ---- */
function formRecurso(){
  openModal('Nuevo recurso',`
    <div class="field"><label for="re_t">Título</label><input id="re_t"></div>
    <div class="field"><label for="re_c">Categoría</label><input id="re_c" placeholder="Ansiedad, Sueño, TCC…"></div>
    <div class="field"><label for="re_ty">Tipo</label><input id="re_ty" placeholder="PDF, Audio, Infografía…"></div>
    <div class="field"><label for="re_d">Descripción</label><textarea id="re_d"></textarea></div>
    <div class="btn-row"><button class="btn" onclick="saveRecurso()">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`);
}
function saveRecurso(){ act(async()=>{ const t=val('re_t'); if(!t)return; await api('resources',{method:'POST',body:{titulo:t,cat:val('re_c'),tipo:val('re_ty'),contenido:val('re_d')}}); closeModal(); await refresh(); }); }

/* ============================================================
   GENOGRAMA (lienzo SVG) — upsert al cerrar
============================================================ */
let GENO=null, dragNode=null, linkFrom=null, linkMode=false, genoPid=null;
function abrirGenograma(pid){
  genoPid=pid; const exist=ST.genograms.find(g=>g.patientId===pid);
  GENO= exist? {nodes:JSON.parse(JSON.stringify(exist.nodes)),edges:JSON.parse(JSON.stringify(exist.edges))} : {nodes:[],edges:[]};
  const pt=ST.patients.find(x=>x.id===pid);
  openModal('Genograma / mapa · '+esc(pt.nombre),`
    <div class="geno-toolbar">
      <button class="btn sm" onclick="addNode('persona')">+ Persona</button>
      <button class="btn sm ghost" onclick="addNode('idea')">+ Idea / creencia</button>
      <button class="btn sm ghost" id="linkBtn" onclick="toggleLink()">Vincular</button>
      <button class="btn sm danger" onclick="clearGeno()">Limpiar</button></div>
    <p class="hint" id="genoHint">Arrastra los nodos. Toca "Vincular" y luego dos nodos para unirlos.</p>
    <div class="geno-wrap"><svg id="genoSvg" viewBox="0 0 320 360" style="width:100%;height:360px;touch-action:none" aria-label="Lienzo"></svg></div>
    <div class="btn-row" style="margin-top:var(--space-2)"><button class="btn" onclick="guardarGenograma()">Guardar y cerrar</button></div>`);
  drawGeno();
}
function addNode(tipo){ const label=prompt(tipo==='persona'?'Nombre / rol:':'Creencia / esquema:'); if(!label)return;
  GENO.nodes.push({id:Math.random().toString(36).slice(2,8),x:60+Math.random()*180,y:60+Math.random()*220,label,tipo}); drawGeno(); }
function toggleLink(){ linkMode=!linkMode; linkFrom=null; document.getElementById('linkBtn').classList.toggle('ghost',!linkMode);
  document.getElementById('genoHint').textContent=linkMode?'Toca dos nodos para vincularlos.':'Arrastra los nodos.'; }
function clearGeno(){ if(confirm('¿Borrar el mapa?')){GENO.nodes=[];GENO.edges=[];drawGeno();} }
function drawGeno(){ const svg=document.getElementById('genoSvg'); if(!svg)return;
  const edges=GENO.edges.map(e=>{const a=GENO.nodes.find(n=>n.id===e.from),b=GENO.nodes.find(n=>n.id===e.to); if(!a||!b)return'';
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#94A3B2" stroke-width="2"/>`;}).join('');
  const nodes=GENO.nodes.map(n=>{const persona=n.tipo==='persona'; const w=persona?64:84,h=persona?40:44;
    return `<g data-id="${n.id}" transform="translate(${n.x-w/2},${n.y-h/2})" style="cursor:grab">
      <rect width="${w}" height="${h}" rx="${persona?8:22}" fill="${persona?'#F0EFF1':'#FBE7EB'}" stroke="${persona?'#1C1D21':'#C41230'}" stroke-width="2"/>
      <text x="${w/2}" y="${h/2+4}" text-anchor="middle" font-size="10" fill="#1F2933">${esc(n.label.slice(0,14))}</text></g>`;}).join('');
  svg.innerHTML=edges+nodes;
  svg.querySelectorAll('g[data-id]').forEach(g=>g.addEventListener('pointerdown',e=>{ const id=g.dataset.id;
    if(linkMode){ if(!linkFrom){linkFrom=id;g.querySelector('rect').setAttribute('stroke-width','4');}
      else if(linkFrom!==id){GENO.edges.push({from:linkFrom,to:id});linkFrom=null;drawGeno();} return; }
    dragNode=id; svg.setPointerCapture(e.pointerId); }));
  svg.onpointermove=e=>{ if(!dragNode)return; const r=svg.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*320, y=(e.clientY-r.top)/r.height*360; const n=GENO.nodes.find(z=>z.id===dragNode);
    n.x=Math.max(20,Math.min(300,x)); n.y=Math.max(25,Math.min(340,y)); drawGeno(); };
  svg.onpointerup=()=>{ dragNode=null; };
}
function guardarGenograma(){ act(async()=>{ await api('genograms',{method:'POST',body:{patientId:genoPid,nodes:GENO.nodes,edges:GENO.edges}}); closeModal(); await refresh(); }); }

/* ============================================================
   SPARKLINE / EXPORT / UTIL
============================================================ */
function sparkline(vals,max){ if(!vals.length)return''; const W=280,H=60,pad=6; max=max||Math.max(...vals,1);
  const step=vals.length>1?(W-2*pad)/(vals.length-1):0;
  const pts=vals.map((v,i)=>`${(pad+i*step).toFixed(1)},${(H-pad-(v/max)*(H-2*pad)).toFixed(1)}`).join(' ');
  const dots=vals.map((v,i)=>`<circle cx="${(pad+i*step).toFixed(1)}" cy="${(H-pad-(v/max)*(H-2*pad)).toFixed(1)}" r="3" fill="var(--primary)"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:60px;margin-top:.4rem" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`; }
function download(name,text){ const b=new Blob([text],{type:'text/plain'}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u); }
function exportAnon(pid){ const p=ST.patients.find(x=>x.id===pid);
  const ses=ST.sessions.filter(s=>s.patientId===pid), tests=ST.tests.filter(t=>t.patientId===pid), goals=ST.goals.filter(g=>g.patientId===pid);
  let t=`RESUMEN DE CASO (ANONIMIZADO)\n============================\nEnfoque: ${p.enfoque||'—'}\nMotivo: ${p.motivo||'—'}\nSesiones: ${ses.length}\n\nOBJETIVOS:\n`;
  goals.forEach(g=>{const last=g.progresos.at(-1)?.valor; t+=`- ${g.titulo} (${g.metrica}): base ${g.baseline} → actual ${last} (meta ${g.target})\n`;});
  t+=`\nPSICOMETRÍA:\n`; tests.forEach(x=>t+=`- ${x.tipo==='PHQ9'?'PHQ-9':'GAD-7'} ${fmt(x.fecha)}: ${x.total} (${x.interpretacion})\n`);
  t+=`\n(Se omiten nombre, código y datos identificables.)`; download(`caso_anonimo_${p.codigo}.txt`,t); }
function exportAll(){ download('asistente_clinico_backup.json',JSON.stringify({patients:ST.patients,sessions:ST.sessions,goals:ST.goals,genograms:ST.genograms,diary:ST.diary,homework:ST.homework,tests:ST.tests,cases:ST.cases,resources:ST.resources},null,2)); }
function borrarTodo(){ if(confirm('Esto borra TODOS tus datos del servidor. ¿Continuar?')&&confirm('Confirma de nuevo: no se puede deshacer.'))
  act(async()=>{ await api('data',{method:'DELETE'}); CURRENT=null; await refresh(); }); }

function riskIcon(s=18){return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="vertical-align:-3px"><path d="M12 3l9 16H3L12 3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>`;}
function chevron(){return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#52606D" stroke-width="2" stroke-linecap="round"/></svg>`;}
function emptyBox(t){return `<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="15" rx="2" stroke="#8A97A5" stroke-width="1.5"/><path d="M8 10h8M8 14h5" stroke="#8A97A5" stroke-width="1.5" stroke-linecap="round"/></svg><div>${t}</div></div>`;}

/* ---- init ---- */
(async function(){ try{ ME=await whoami(); }catch{ ME=null; } if(ME){ try{ await refresh(); }catch{ logout(); } } else render(); })();
